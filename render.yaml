databases:
  - name: chengdu-dinner-db
    plan: free
    region: singapore
    databaseName: dinner
    user: dinner
    ipAllowList: []

services:
  - type: web
    name: chengdu-dinner-vote
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: chengdu-dinner-db
          property: connectionString
